apiVersion: 1

datasources:
  - name: Local DuckDB
    type: motherduck-duckdb-datasource
    access: proxy
    isDefault: true
    jsonData:
      # This path must match the internal container path defined in your volume mount
      path: "/var/lib/grafana/duckdb_data?access_mode=READ_ONLY"
      maxOpenConns: 1
      maxIdleConns: 0
      connMaxLifetime: 1 # Closes connection after 1 second
    # Optional: If you want to run configurations immediately when the database opens
    # secureJsonData:
    #   preSql: "SET memory_limit='2GB';"
